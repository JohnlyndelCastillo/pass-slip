services:
  web:
    build: .
    container_name: pass-slip-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      # Blocks direct access to .env, .git, SQL files, etc. (see the file for details)
      - ./docker/apache-hardening.conf:/etc/apache2/conf-enabled/apache-hardening.conf:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pass-slip-network

  db:
    image: mysql:8.0
    container_name: pass-slip-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      # Bound to localhost only so the DB isn't reachable from other machines on your network
      - "127.0.0.1:3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      # TCP ping (-h 127.0.0.1) only succeeds once the real server is up, not the temporary init server
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - pass-slip-network

networks:
  pass-slip-network:
    driver: bridge

volumes:
  db_data: