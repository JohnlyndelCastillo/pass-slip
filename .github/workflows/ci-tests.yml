name: CI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel an older run of the same branch when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: runs on the runner itself, no Docker needed
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # match the PHP version used in your Dockerfile

      - name: PHP syntax check
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      DB_HOST: pass-slip-mysql
      DB_PORT: 3306
      DB_NAME: pass_slip_system
      DB_USER: root
      DB_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Build and start Docker containers
        # --wait blocks until the db healthcheck passes (defined in docker-compose.yml)
        run: docker compose up -d --build --wait

      - name: Verify database schema
        run: |
          tables=$(docker exec -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" pass-slip-mysql \
            mysql -uroot -N -B pass_slip_system -e "SHOW TABLES;")
          echo "$tables"
          for t in users pass_slips; do
            echo "$tables" | grep -qx "$t" || { echo "Missing table: $t"; exit 1; }
          done

      - name: Wait for web server
        run: |
          curl -fsS -o /dev/null \
            --retry 15 --retry-delay 2 --retry-connrefused \
            http://localhost:8080/dashboard/login.php

      - name: Protected pages reject guests
        run: |
          # Adjust the path if your dashboard URL differs. Any status other than 200
          # (redirect to login, 401, 403) means the auth guard is doing its job.
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/dashboard/admin/dashboard.php)
          echo "HTTP $code"
          [ "$code" != "200" ] || { echo "Admin dashboard is reachable without logging in"; exit 1; }

      - name: Sensitive files are not served
        run: |
          status=0
          for path in .env database/init.sql docker-compose.yml .aider.chat.history.md; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/$path")
            echo "/$path -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Publicly readable: /$path"
              status=1
            fi
          done
          exit $status

      - name: View logs on failure
        if: failure()
        run: |
          echo "=== Web Server Logs ==="
          docker logs pass-slip-web
          echo "=== Database Logs ==="
          docker logs pass-slip-mysql

      - name: Stop containers
        if: always()
        run: docker compose down -v