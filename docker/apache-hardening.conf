# Save as docker/apache-hardening.conf (mounted by docker-compose.yml)

# Deny config, docs, SQL, and tool files that shouldn't be downloadable
<FilesMatch "^(Dockerfile|docker-compose\.ya?ml|\.env.*|\.aider.*|\.gitignore|README\.md)$|\.(sql|md|conf|cache|db|history)$">
    Require all denied
</FilesMatch>

# Deny whole directories that hold source control, CI, tool caches, and DB scripts
<DirectoryMatch "^/var/www/html/(database|docker|\.git|\.github|\.aider[^/]*)(/|$)">
    Require all denied
</DirectoryMatch>

# No directory listings + front-controller routing
# (adjust the path if your Dockerfile changes the document root)
<Directory /var/www/html>
    Options -Indexes

    RewriteEngine On
    # If the request matches a real FILE, serve it as-is (this is what keeps
    # public/css, public/js, and any direct .php links working as before).
    # Deliberately NOT excluding real directories: routes like
    # /dashboard/student collide with the actual dashboard/student/ folder,
    # and we want those to go through index.php, not be served by Apache
    # directly (which 403s since there's no index.php inside that folder
    # and directory listing is off).
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ index.php [QSA,L]
</Directory>