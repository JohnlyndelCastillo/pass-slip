# Save as docker/apache-hardening.conf (mounted by docker-compose.yml)

# Deny config, docs, SQL, and tool files that shouldn't be downloadable
<FilesMatch "^(Dockerfile|docker-compose\.ya?ml|\.env.*|\.aider.*|\.gitignore|README\.md)$|\.(sql|md|conf|cache|db|history)$">
    Require all denied
</FilesMatch>

# Deny whole directories that hold source control, CI, tool caches, and DB scripts
<DirectoryMatch "^/var/www/html/(database|docker|\.git|\.github|\.aider[^/]*)(/|$)">
    Require all denied
</DirectoryMatch>

# No directory listings (adjust the path if your Dockerfile changes the document root)
<Directory /var/www/html>
    Options -Indexes
</Directory>